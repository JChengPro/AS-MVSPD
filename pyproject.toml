[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "as-mvspd"
version = "0.1.0"
description = "Adaptive sparse multi-view stable paired differential detection"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy==1.23.5", "pandas==1.5.3", "scipy==1.10.0"]

[project.scripts]
as-mvspd = "stablejoint.cli:main"

[project.optional-dependencies]
reproduce = ["matplotlib==3.7.0", "openpyxl==3.0.10", "Pillow==12.2.0"]
test = ["pytest==7.1.2"]

[tool.setuptools.packages.find]
include = ["stablejoint*"]

[tool.setuptools.package-data]
stablejoint = ["figure_style.json"]
